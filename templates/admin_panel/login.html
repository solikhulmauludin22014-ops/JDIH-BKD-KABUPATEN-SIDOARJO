<!DOCTYPE html>
<html lang="id" class="h-full bg-slate-900">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login Pengelola - JDIH BKD Kabupaten Sidoarjo</title>

    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Inter:wght@400;500;600;700&display=swap"
        rel="stylesheet">

    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: {
                        sans: ['Plus Jakarta Sans', 'Inter', 'sans-serif'],
                    }
                }
            }
        }
    </script>

    <!-- Firebase Compat SDK for Web Authentication -->
    <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-auth-compat.js"></script>

    <link rel="stylesheet" href="/static/css/custom.css">
</head>

<body
    class="h-full flex items-center justify-center p-4 bg-gradient-to-br from-slate-950 via-slate-900 to-blue-950 font-sans text-slate-800">
    <div class="w-full max-w-md">
        <!-- Logo & Heading -->
        <div class="text-center mb-8">
            <div
                class="w-16 h-16 rounded-2xl bg-gradient-to-tr from-blue-600 to-indigo-600 flex items-center justify-center text-white mx-auto mb-4 shadow-xl shadow-blue-500/20">
                <svg class="w-9 h-9" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    <path stroke-linecap="round" stroke-linejoin="round"
                        d="M3 6l3 1m0 0l-3 9a5.002 5.002 0 006.001 0M6 7l3 9M6 7l6-2m6 2l3-1m-3 1l-3 9a5.002 5.002 0 006.001 0M18 7l3 9m-3-9l-6-2m0-2v2m0 16V5m0 16H9m3 0h3" />
                </svg>
            </div>
            <h1 class="text-2xl font-extrabold text-white tracking-tight">Login Pengelola JDIH</h1>
            <p class="text-xs text-slate-400 mt-1">Badan Kepegawaian Daerah Kabupaten Sidoarjo</p>
        </div>

        <!-- Card Container -->
        <div class="bg-white rounded-3xl p-8 shadow-2xl border border-slate-800/10 relative overflow-hidden">
            <div class="absolute top-0 left-0 right-0 h-1.5 bg-gradient-to-r from-blue-600 to-indigo-600"></div>

            <!-- Flash Alerts -->
            {% if messages %}
            <div class="mb-4">
                {% for message in messages %}
                <div
                    class="p-3.5 rounded-xl text-xs font-semibold mb-2 {% if message.tags == 'error' %}bg-rose-50 text-rose-800 border border-rose-200{% elif message.tags == 'warning' %}bg-amber-50 text-amber-800 border border-amber-200{% else %}bg-blue-50 text-blue-800 border border-blue-200{% endif %}">
                    {{ message }}
                </div>
                {% endfor %}
            </div>
            {% endif %}

            <!-- Client Status Alert (Hidden by default) -->
            <div id="js-alert" class="hidden mb-4 p-3.5 rounded-xl text-xs font-semibold"></div>

            <!-- Login Form -->
            <form id="login-form" method="POST" action="{% url 'admin_panel:login' %}">
                {% csrf_token %}
                <input type="hidden" name="id_token" id="id_token">
                <input type="hidden" name="next" value="{{ next_url }}">

                <div class="space-y-4">
                    <div>
                        <label for="email"
                            class="block text-xs font-bold text-slate-700 uppercase tracking-wider mb-1.5">Email
                            Pengelola BKD</label>
                        <div class="relative">
                            <input type="email" name="email" id="email" required value="admin@bkd.sidoarjokab.go.id"
                                placeholder="nama@bkd.sidoarjokab.go.id"
                                class="w-full rounded-xl border-slate-300 text-sm py-2.5 px-3.5 focus:border-blue-600 focus:ring-blue-600 shadow-sm transition">
                        </div>
                    </div>

                    <div>
                        <div class="flex items-center justify-between mb-1.5">
                            <label for="password"
                                class="block text-xs font-bold text-slate-700 uppercase tracking-wider">Kata
                                Sandi</label>
                            <span class="text-[11px] text-slate-400">Firebase Auth</span>
                        </div>
                        <input type="password" name="password" id="password" required value="admin123"
                            placeholder="••••••••"
                            class="w-full rounded-xl border-slate-300 text-sm py-2.5 px-3.5 focus:border-blue-600 focus:ring-blue-600 shadow-sm transition">
                    </div>

                    <div class="pt-2">
                        <button type="submit" id="submit-btn"
                            class="w-full py-3 px-4 rounded-xl bg-gradient-to-r from-blue-600 to-indigo-600 text-white font-bold text-sm hover:from-blue-700 hover:to-indigo-700 shadow-lg shadow-blue-600/25 transition flex items-center justify-center gap-2">
                            <span id="btn-text">Masuk ke Panel Admin</span>
                            <svg id="btn-spinner" class="hidden animate-spin h-4 w-4 text-white" fill="none"
                                viewBox="0 0 24 24">
                                <circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor"
                                    stroke-width="4"></circle>
                                <path class="opacity-75" fill="currentColor"
                                    d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z">
                                </path>
                            </svg>
                        </button>
                    </div>
                </div>
            </form>

            <!-- Quick Demo Credentials Box -->
            <div class="mt-6 p-4 rounded-2xl bg-slate-50 border border-slate-200/80">
                <div class="flex items-center justify-between text-xs mb-1.5">
                    <span class="font-bold text-slate-700 flex items-center gap-1.5">
                        <svg class="w-4 h-4 text-blue-600" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                                d="M13 16h-1v-4h-1m1-4h.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z" />
                        </svg>
                        <span>Akses Cepat Pengujian:</span>
                    </span>
                    <span
                        class="text-[10px] uppercase font-bold text-emerald-600 bg-emerald-50 px-1.5 py-0.5 rounded">Ready</span>
                </div>
                <div class="text-[11px] text-slate-600 font-mono space-y-0.5">
                    <div>Email: <span class="font-bold text-slate-800">admin@bkd.sidoarjokab.go.id</span></div>
                    <div>Pass : <span class="font-bold text-slate-800">admin123</span></div>
                </div>
                <button type="button"
                    onclick="document.getElementById('email').value='admin@bkd.sidoarjokab.go.id'; document.getElementById('password').value='admin123'; document.getElementById('login-form').submit();"
                    class="mt-3 w-full py-1.5 px-3 rounded-lg text-xs font-semibold bg-white hover:bg-slate-100 text-slate-700 border border-slate-300 transition text-center shadow-xs">
                    Masuk Sekali Klik (Demo Mode)
                </button>
            </div>
        </div>

        <!-- Return to Home -->
        <div class="text-center mt-6">
            <a href="{% url 'documents:index' %}"
                class="inline-flex items-center gap-1 text-xs font-semibold text-slate-400 hover:text-white transition">
                <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                        d="M10 19l-7-7m0 0l7-7m-7 7h18" />
                </svg>
                <span>Kembali ke Beranda Publik JDIH</span>
            </a>
        </div>
    </div>

    <!-- Firebase Auth JavaScript Client Script -->
    <script>
        const firebaseConfig = {
            apiKey: "{{ FIREBASE_WEB_CONFIG.apiKey }}",
            authDomain: "{{ FIREBASE_WEB_CONFIG.authDomain }}",
            projectId: "{{ FIREBASE_WEB_CONFIG.projectId }}",
            appId: "{{ FIREBASE_WEB_CONFIG.appId }}"
        };

        const form = document.getElementById('login-form');
        const submitBtn = document.getElementById('submit-btn');
        const btnText = document.getElementById('btn-text');
        const btnSpinner = document.getElementById('btn-spinner');
        const alertBox = document.getElementById('js-alert');

        function showAlert(msg, isError = true) {
            alertBox.classList.remove('hidden', 'bg-rose-50', 'text-rose-800', 'border-rose-200', 'bg-emerald-50', 'text-emerald-800', 'border-emerald-200');
            if (isError) {
                alertBox.classList.add('bg-rose-50', 'text-rose-800', 'border', 'border-rose-200');
            } else {
                alertBox.classList.add('bg-emerald-50', 'text-emerald-800', 'border', 'border-emerald-200');
            }
            alertBox.innerText = msg;
        }

        // Check if Firebase Web Config is present
        let firebaseApp = null;
        if (firebaseConfig.apiKey && firebaseConfig.apiKey.length > 5) {
            try {
                firebaseApp = firebase.initializeApp(firebaseConfig);
            } catch (e) {
                console.warn("Firebase Client Init Note:", e);
            }
        }

        form.addEventListener('submit', async (e) => {
            const email = document.getElementById('email').value.trim();
            const password = document.getElementById('password').value.trim();

            // If Firebase Web App is initialized, authenticate via Firebase Client SDK
            if (firebaseApp && firebase.auth) {
                e.preventDefault();
                submitBtn.disabled = true;
                btnText.innerText = "Memverifikasi via Firebase...";
                btnSpinner.classList.remove('hidden');

                try {
                    const userCredential = await firebase.auth().signInWithEmailAndPassword(email, password);
                    const idToken = await userCredential.user.getIdToken();

                    // Send ID token to Django session endpoint
                    const response = await fetch("{% url 'admin_panel:session_login_api' %}", {
                        method: 'POST',
                        headers: {
                            'Content-Type': 'application/json',
                            'X-CSRFToken': '{{ csrf_token }}',
                        },
                        body: JSON.stringify({
                            id_token: idToken,
                            email: email
                        })
                    });

                    const resData = await response.json();
                    if (resData.status === 'ok') {
                        btnText.innerText = "Berhasil! Mengalihkan...";
                        window.location.href = resData.redirect || "{% url 'admin_panel:dashboard' %}";
                    } else {
                        showAlert(resData.message || "Gagal memvalidasi sesi admin.");
                        submitBtn.disabled = false;
                        btnText.innerText = "Masuk ke Panel Admin";
                        btnSpinner.classList.add('hidden');
                    }
                } catch (err) {
                    console.error("Firebase Login Error:", err);
                    let errorMsg = "Gagal login Firebase: ";
                    const code = err.code || "";
                    if (code === 'auth/user-not-found' || code === 'auth/wrong-password' || code === 'auth/invalid-credential') {
                        errorMsg = "Email atau kata sandi tidak sesuai. Silakan periksa kembali.";
                    } else if (code === 'auth/too-many-requests') {
                        errorMsg = "Terlalu banyak percobaan gagal. Akses dibatasi sementara, silakan coba lagi beberapa saat lagi.";
                    } else if (code === 'auth/invalid-email') {
                        errorMsg = "Format alamat email tidak valid.";
                    } else if (code === 'auth/user-disabled') {
                        errorMsg = "Akun pengelola ini telah dinonaktifkan oleh administrator.";
                    } else if (code === 'auth/network-request-failed') {
                        errorMsg = "Gagal terhubung ke server autentikasi. Pastikan koneksi internet aktif.";
                    } else if (code === 'auth/operation-not-allowed' || (err.message && err.message.includes('CONFIGURATION_NOT_FOUND'))) {
                        errorMsg = "Metode login Email/Password belum diaktifkan di Firebase Console. Pastikan Sign-in method diaktifkan.";
                    } else {
                        errorMsg += (err.message || err);
                    }
                    showAlert(errorMsg);
                    submitBtn.disabled = false;
                    btnText.innerText = "Masuk ke Panel Admin";
                    btnSpinner.classList.add('hidden');
                }
            } else {
                // Regular submission (Django server handles verification & session)
                btnText.innerText = "Memproses...";
                btnSpinner.classList.remove('hidden');
            }
        });
    </script>
</body>

</html>
